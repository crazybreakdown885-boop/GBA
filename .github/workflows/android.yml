name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GBA Enhanced project
        uses: actions/checkout@v4
      - name: Checkout SkyEmu emulator engine (MIT)
        uses: actions/checkout@v4
        with:
          repository: skylersaleh/SkyEmu
          ref: b64903f0fde8104d0796546b96859e9f682311b7
          path: vendor/SkyEmu
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android native build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;22.1.7171670" "cmake;3.18.1"
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
      - name: Brand application
        working-directory: vendor/SkyEmu/tools/android_project
        run: |
          sed -i 's#<string name="app_name">SkyEmu</string>#<string name="app_name">GBA Enhanced</string>#' app/src/main/res/values/strings.xml
      - name: Build Android APK
        working-directory: vendor/SkyEmu/tools/android_project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Stage APK
        run: |
          APK=$(find vendor/SkyEmu/tools/android_project/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" GBA-Enhanced.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBA-Enhanced-APK
          path: GBA-Enhanced.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 >/dev/null 2>&1 || gh release create v0.1.0 --target "$GITHUB_SHA" --title "GBA Enhanced v0.1.0" --notes "Android GBA emulator build. See README for included features and known limitations."
          gh release upload v0.1.0 GBA-Enhanced.apk --clobber
